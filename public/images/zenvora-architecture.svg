<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 830" width="100%" height="100%" style="background:#131417; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e4e4e7"/>
    </marker>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1360" height="830" fill="#131417"/>

  <!-- ====================================================================== -->
  <!-- 1. LAYER 1: CLIENT & PRESENTATION LAYER                               -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 25)">
    <!-- Container -->
    <rect x="0" y="0" width="1300" height="135" rx="6" fill="#18191e" stroke="#2b2d35" stroke-width="1.2"/>
    <!-- Top Header Bar -->
    <path d="M 0 6 Q 0 0 6 0 L 1294 0 Q 1300 0 1300 6 L 1300 28 L 0 28 z" fill="#20222a"/>
    <text x="16" y="19" font-size="12" font-weight="700" fill="#e4e4e7">1. Client &amp; Presentation Layer (Next.js 14 / React 18)</text>

    <!-- Card 1.1: Focus Audio Player -->
    <g transform="translate(20, 42)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="230" height="72" rx="6" fill="#1e2027" stroke="#323540" stroke-width="1.2"/>
      <text x="115" y="30" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">🎧 Focus Audio Player</text>
      <text x="115" y="50" font-size="10.5" fill="#a1a1aa" text-anchor="middle">(63 Study Tracks + Mood Pills)</text>
    </g>

    <!-- Card 1.2: Tech Roadmaps & System Design -->
    <g transform="translate(275, 42)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="245" height="72" rx="6" fill="#1e2027" stroke="#323540" stroke-width="1.2"/>
      <text x="122" y="30" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">📖 Tech Roadmaps &amp; System Design</text>
      <text x="122" y="50" font-size="10.5" fill="#a1a1aa" text-anchor="middle">(Curated Resource Hub)</text>
    </g>

    <!-- Card 1.3: PDF Notes Reader -->
    <g transform="translate(545, 42)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="72" rx="6" fill="#1e2027" stroke="#323540" stroke-width="1.2"/>
      <text x="110" y="30" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">📑 PDF Notes Reader</text>
      <text x="110" y="50" font-size="10.5" fill="#a1a1aa" text-anchor="middle">(PDF.js Canvas + Text Layer)</text>
    </g>

    <!-- Card 1.4: Admin Dashboard -->
    <g transform="translate(790, 42)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="72" rx="6" fill="#1e2027" stroke="#323540" stroke-width="1.2"/>
      <text x="110" y="30" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">⚙️ Admin Dashboard</text>
      <text x="110" y="50" font-size="10.5" fill="#a1a1aa" text-anchor="middle">(Chunked Upload &amp; CMS)</text>
    </g>

    <!-- Card 1.5: Opportunities & Scholarships -->
    <g transform="translate(1035, 42)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="245" height="72" rx="6" fill="#1e2027" stroke="#323540" stroke-width="1.2"/>
      <text x="122" y="30" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">🎯 Opportunities &amp; Scholarships</text>
      <text x="122" y="50" font-size="10.5" fill="#a1a1aa" text-anchor="middle">(Category Tabs &amp; Filters)</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- 2. LAYER 2: API & SERVERLESS HANDLERS                                 -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 275)">
    <!-- Container -->
    <rect x="0" y="0" width="1300" height="135" rx="6" fill="#18191e" stroke="#2b2d35" stroke-width="1.2"/>
    <!-- Top Header Bar -->
    <path d="M 0 6 Q 0 0 6 0 L 1294 0 Q 1300 0 1300 6 L 1300 28 L 0 28 z" fill="#20222a"/>
    <text x="16" y="19" font-size="12" font-weight="700" fill="#e4e4e7">2. API &amp; Serverless Handlers (Next.js Route Handlers)</text>

    <!-- Card 2.1: YouTube Audio Engine Bridge -->
    <g transform="translate(30, 42)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="250" height="72" rx="6" fill="#1e2027" stroke="#323540" stroke-width="1.2"/>
      <text x="125" y="30" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">🎵 YouTube Audio Engine Bridge</text>
      <text x="125" y="50" font-size="10.5" fill="#a1a1aa" text-anchor="middle">(IFrame State &amp; Event Bus)</text>
    </g>

    <!-- Card 2.2: /api/notes/pdf/[id] -->
    <g transform="translate(310, 42)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="200" height="72" rx="6" fill="#1e2027" stroke="#323540" stroke-width="1.2"/>
      <text x="100" y="42" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ /api/notes/pdf/[id]</text>
    </g>

    <!-- Card 2.3: /api/admin/notes/upload -->
    <g transform="translate(540, 42)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="345" height="72" rx="6" fill="#1e2027" stroke="#323540" stroke-width="1.2"/>
      <text x="172" y="30" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">🧩 /api/admin/notes/upload</text>
      <text x="172" y="50" font-size="10.5" fill="#a1a1aa" text-anchor="middle">(Chunked Upload &amp; Buffer Stitch Engine)</text>
    </g>

    <!-- Card 2.4: NextAuth / Auth Guard -->
    <g transform="translate(915, 42)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="355" height="72" rx="6" fill="#1e2027" stroke="#323540" stroke-width="1.2"/>
      <text x="177" y="30" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">🔒 NextAuth / Auth Guard</text>
      <text x="177" y="50" font-size="10.5" fill="#a1a1aa" text-anchor="middle">(Session Management &amp; Protected Endpoints)</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- 3. LAYER 3: PERSISTENCE & STORAGE LAYER                               -->
  <!-- ====================================================================== -->
  <g transform="translate(30, 520)">
    <!-- Container -->
    <rect x="0" y="0" width="1300" height="275" rx="6" fill="#18191e" stroke="#2b2d35" stroke-width="1.2"/>
    <!-- Top Header Bar -->
    <path d="M 0 6 Q 0 0 6 0 L 1294 0 Q 1300 0 1300 6 L 1300 28 L 0 28 z" fill="#20222a"/>
    <text x="16" y="19" font-size="12" font-weight="700" fill="#e4e4e7">3. Persistence &amp; Storage Layer</text>

    <!-- Card 3.1: Client LocalStorage -->
    <g transform="translate(30, 42)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="220" height="72" rx="6" fill="#1e2027" stroke="#323540" stroke-width="1.2"/>
      <text x="110" y="30" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">💾 Client LocalStorage</text>
      <text x="110" y="50" font-size="10.5" fill="#a1a1aa" text-anchor="middle">(Favorites, Recents, Volume)</text>
    </g>

    <!-- Card 3.2: YouTube Global CDN -->
    <g transform="translate(280, 42)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="345" height="72" rx="6" fill="#1e2027" stroke="#323540" stroke-width="1.2"/>
      <text x="172" y="30" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">☁️ YouTube Global CDN</text>
      <text x="172" y="50" font-size="10.5" fill="#a1a1aa" text-anchor="middle">(Streams 63 Audio Tracks at 0 Server Load)</text>
    </g>

    <!-- Card 3.3: Prisma ORM 5.21 -->
    <g transform="translate(655, 42)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="230" height="72" rx="6" fill="#1e2027" stroke="#323540" stroke-width="1.2"/>
      <text x="115" y="30" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ Prisma ORM 5.21</text>
      <text x="115" y="50" font-size="10.5" fill="#a1a1aa" text-anchor="middle">(Type-safe Query Engine)</text>
    </g>

    <!-- Card 3.4: Neon Serverless PostgreSQL Database Node -->
    <g transform="translate(635, 155)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="270" height="85" rx="8" fill="#1c1f26" stroke="#383c48" stroke-width="1.5"/>
      <text x="135" y="28" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">🐘 Neon Serverless PostgreSQL</text>
      <text x="135" y="48" font-size="10.5" fill="#a1a1aa" text-anchor="middle">- NoteFile (bytea binary data)</text>
      <text x="135" y="66" font-size="10.5" fill="#a1a1aa" text-anchor="middle">- Scholarship &amp; Settings</text>
    </g>
  </g>

  <!-- ====================================================================== -->
  <!-- ORTHOGONAL CONNECTING ARROWS & STEP BADGES                             -->
  <!-- ====================================================================== -->

  <!-- Flow 1: PDF Notes Reader -> /api/notes/pdf/[id] -->
  <g>
    <!-- PDF Notes center x=685, bottom y=139. /api/notes center x=440, top y=317 -->
    <path d="M 685 139 L 685 195 L 440 195 L 440 317" fill="none" stroke="#52525b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <!-- Pill 1 -->
    <g transform="translate(490, 183)">
      <rect x="0" y="0" width="145" height="24" rx="4" fill="#181a20" stroke="#3f3f46" stroke-width="1"/>
      <text x="72" y="16" font-size="11" font-weight="600" fill="#e4e4e7" text-anchor="middle">1. Requests PDF binary</text>
    </g>
  </g>

  <!-- Flow 2: /api/notes/pdf/[id] -> Prisma ORM 5.21 -->
  <g>
    <!-- /api/notes bottom x=440, y=389. Prisma center x=800, top y=562 -->
    <path d="M 440 389 L 440 450 L 740 450 L 740 562" fill="none" stroke="#52525b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <!-- Pill 2 -->
    <g transform="translate(485, 438)">
      <rect x="0" y="0" width="140" height="24" rx="4" fill="#181a20" stroke="#3f3f46" stroke-width="1"/>
      <text x="70" y="16" font-size="11" font-weight="600" fill="#e4e4e7" text-anchor="middle">2. Reads Bytea buffer</text>
    </g>
  </g>

  <!-- Flow 3: Admin Dashboard -> /api/admin/notes/upload -->
  <g>
    <!-- Admin center x=930, bottom y=139. Upload center x=742, top y=317 -->
    <path d="M 930 139 L 930 205 L 742 205 L 742 317" fill="none" stroke="#52525b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <!-- Pill 3 -->
    <g transform="translate(755, 193)">
      <rect x="0" y="0" width="160" height="24" rx="4" fill="#181a20" stroke="#3f3f46" stroke-width="1"/>
      <text x="80" y="16" font-size="11" font-weight="600" fill="#e4e4e7" text-anchor="middle">3. Uploads multi-MB chunks</text>
    </g>
  </g>

  <!-- Flow 4: /api/admin/notes/upload -> Prisma ORM 5.21 -->
  <g>
    <!-- Upload bottom x=742, y=389. Prisma center x=800, top y=562 -->
    <path d="M 742 389 L 742 440 L 790 440 L 790 562" fill="none" stroke="#52525b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <!-- Pill 4 -->
    <g transform="translate(685, 428)">
      <rect x="0" y="0" width="175" height="24" rx="4" fill="#181a20" stroke="#3f3f46" stroke-width="1"/>
      <text x="87" y="16" font-size="11" font-weight="600" fill="#e4e4e7" text-anchor="middle">4. Assembles &amp; writes NoteFile</text>
    </g>
  </g>

  <!-- Flow 5: Focus Audio Player -> YouTube Audio Engine Bridge -->
  <g>
    <!-- Focus Audio center x=165, bottom y=139. Bridge center x=185, top y=317 -->
    <path d="M 165 139 L 165 210 L 185 210 L 185 317" fill="none" stroke="#52525b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <!-- Pill 5 -->
    <g transform="translate(195, 198)">
      <rect x="0" y="0" width="160" height="24" rx="4" fill="#181a20" stroke="#3f3f46" stroke-width="1"/>
      <text x="80" y="16" font-size="11" font-weight="600" fill="#e4e4e7" text-anchor="middle">5. Triggers audio playback</text>
    </g>
  </g>

  <!-- Flow 6: YouTube Audio Engine Bridge -> YouTube Global CDN -->
  <g>
    <!-- Bridge bottom x=185, y=389. CDN center x=482, top y=562 -->
    <path d="M 185 389 L 185 450 L 452 450 L 452 562" fill="none" stroke="#52525b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <!-- Pill 6 -->
    <g transform="translate(250, 438)">
      <rect x="0" y="0" width="145" height="24" rx="4" fill="#181a20" stroke="#3f3f46" stroke-width="1"/>
      <text x="72" y="16" font-size="11" font-weight="600" fill="#e4e4e7" text-anchor="middle">6. Streams audio stream</text>
    </g>
  </g>

  <!-- Flow 7: Focus Audio Player -> Client LocalStorage (Dashed) -->
  <g>
    <!-- Straight vertical line from x=90, y=139 down to x=90, y=562 -->
    <path d="M 90 139 L 90 562" fill="none" stroke="#71717a" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <!-- Pill 7 -->
    <g transform="translate(20, 345)">
      <rect x="0" y="0" width="165" height="24" rx="4" fill="#181a20" stroke="#3f3f46" stroke-width="1"/>
      <text x="82" y="16" font-size="11" font-weight="600" fill="#e4e4e7" text-anchor="middle">7. Saves favorites &amp; recents</text>
    </g>
  </g>

  <!-- Flow 8: Opportunities & Scholarships -> Prisma ORM 5.21 -->
  <g>
    <!-- Opps center x=1187, bottom y=139. Path down to y=470, left to x=830, down to y=562 -->
    <path d="M 1187 139 L 1187 470 L 830 470 L 830 562" fill="none" stroke="#52525b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <!-- Pill 8 -->
    <g transform="translate(930, 458)">
      <rect x="0" y="0" width="170" height="24" rx="4" fill="#181a20" stroke="#3f3f46" stroke-width="1"/>
      <text x="85" y="16" font-size="11" font-weight="600" fill="#e4e4e7" text-anchor="middle">8. Queries scholarship grants</text>
    </g>
  </g>

  <!-- Flow 9: Admin Dashboard -> NextAuth / Auth Guard -->
  <g>
    <!-- Admin right edge x=970, y=139. NextAuth center x=1122, top y=317 -->
    <path d="M 970 139 L 970 195 L 1122 195 L 1122 317" fill="none" stroke="#52525b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <!-- Pill 9 -->
    <g transform="translate(995, 183)">
      <rect x="0" y="0" width="175" height="24" rx="4" fill="#181a20" stroke="#3f3f46" stroke-width="1"/>
      <text x="87" y="16" font-size="11" font-weight="600" fill="#e4e4e7" text-anchor="middle">9. Admin session verification</text>
    </g>
  </g>

  <!-- Flow 10: Prisma ORM 5.21 -> Neon Serverless PostgreSQL -->
  <g>
    <path d="M 770 634 L 770 675" fill="none" stroke="#52525b" stroke-width="1.4" marker-end="url(#arrow)"/>
  </g>
</svg>